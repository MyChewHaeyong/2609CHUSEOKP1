<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>팔도마블 - 중계 화면</title>
<style>
  :root{ --bg:#1E1B3A; --panel:#262048cc; --gold:#D9A441; --cream:#F4E9D8; --line:#3A3466; --ok:#4E9F63; --red:#E5867A; }
  *{box-sizing:border-box}
  html,body{margin:0; width:100%; height:100%}
  body{background:var(--bg); color:var(--cream); font-family:"Malgun Gothic","맑은 고딕",sans-serif;}
  body.transparent{background:transparent}
  .wrap{max-width:1000px; margin:0 auto; padding:22px}
  h1{color:var(--gold); font-size:28px; margin:0 0 2px; text-align:center}
  .code{text-align:center; font-size:14px; color:#cfcbea; margin-bottom:18px; letter-spacing:.05em}

  .grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:20px}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 14px; backdrop-filter:blur(2px); border-top:3px solid transparent; display:flex; gap:10px; align-items:center}
  .card .name{font-size:16px; font-weight:700}
  .card .seat{font-size:11.5px; color:#9d97c2; margin-top:2px}
  .card .cash{font-size:13.5px; color:var(--gold); margin-top:6px; font-weight:600}
  .dot{width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:7px; background:#666}
  .dot.on{background:var(--ok)}

  /* 캐릭터 아바타 — 지금은 이모지, 나중에 public/characters/char1~4.png를 올리면 자동으로 이미지로 전환됨 */
  .avatar{position:relative; border-radius:50%; border:2px solid var(--line); display:flex; align-items:center; justify-content:center; overflow:hidden; flex-shrink:0; background:#160f2e}
  .avatar img{display:block; width:100%; height:100%; object-fit:cover}
  .avatar .avatar-fallback{display:none; line-height:1}
  .card .avatar{width:44px; height:44px; font-size:22px}
  .name-avatar{display:inline-flex; align-items:center; gap:8px}

  /* 사각형 보드판(부루마블 스타일): 21칸을 정사각형 둘레에 배치 */
  .squareboard{position:relative; width:100%; max-width:640px; aspect-ratio:1/1; margin:0 auto; background:#160f2e; border:1px solid var(--line); border-radius:16px; overflow:hidden}
  .sb-tile{position:absolute; width:13%; height:13%; transform:translate(-50%,-50%); border-radius:8px; border:1px solid var(--line); background:var(--panel); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:3px; line-height:1.2; backdrop-filter:blur(2px); overflow:hidden}
  .sb-tile.start{background:color-mix(in srgb, var(--gold) 28%, var(--panel))}
  .sb-tile.event{background:color-mix(in srgb, #6C5D8A 32%, var(--panel))}
  .sb-tile.here{border-color:var(--gold); border-width:2px}
  /* 칸별 배경 이미지 — 지금은 파일이 없어 항상 숨겨지고 기존 색상 배경 그대로 나옴.
     나중에 public/tiles/tile0.png ~ tile20.png(칸 번호 = TILES 배열의 pos값)를 저장소에
     올리면 코드 수정 없이 자동으로 적용됨. */
  .sb-tile-img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:.6}
  .sb-tile-shade{position:absolute; inset:0; background:linear-gradient(180deg, rgba(22,15,46,.15), rgba(22,15,46,.8))}
  .sb-tile .sb-region, .sb-tile .sb-name, .sb-tile .sb-owner, .sb-tile .sb-tokens{position:relative; z-index:1}
  .sb-tile .sb-region{width:6px; height:6px; border-radius:50%; margin-bottom:2px}
  .sb-tile .sb-name{font-weight:700; color:var(--cream); font-size:10.5px; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .sb-tile .sb-owner{font-size:9px; color:var(--gold); margin-top:1px; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .sb-tokens{display:flex; gap:2px; margin-top:2px; flex-wrap:wrap; justify-content:center}
  .sb-token{width:15px; height:15px; border-radius:50%; border:1px solid var(--panel); display:flex; align-items:center; justify-content:center; font-size:10px; line-height:1}
  .sb-center{position:absolute; left:15%; top:15%; right:15%; bottom:15%; display:flex; align-items:center; justify-content:center; text-align:center; border:1px dashed var(--line); border-radius:14px}
  .sb-center-inner .who{font-size:20px; font-weight:700; color:var(--gold)}
  .sb-center-inner .what{font-size:13px; color:#cfcbea; margin-top:6px}
  .sb-center-inner .timer{margin-top:14px; font-size:16px; font-family:monospace}
  .sb-center-inner .timer.hot{color:var(--red); font-weight:700}

  .legend{display:flex; flex-wrap:wrap; gap:12px; margin-top:14px; font-size:11.5px; color:#9d97c2; justify-content:center}
  .legend span{display:inline-flex; align-items:center; gap:5px}
  .legend i{width:9px; height:9px; border-radius:50%; display:inline-block}

  .rankwrap{max-width:520px; margin:0 auto}
  table{width:100%; border-collapse:collapse; font-size:15px}
  th,td{padding:8px 10px; text-align:left; border-bottom:1px solid var(--line)}
  td.num{text-align:right}

  .phase{text-align:center; margin-top:16px; font-size:13px; color:#cfcbea}
</style>
</head>
<body>
  <div class="wrap">
    <h1>팔도마블</h1>
    <div class="code" id="codeLine">방 코드 -</div>

    <div class="grid" id="grid"></div>

    <div id="boardWrap" class="squareboard">
      <div class="sb-center"><div class="sb-center-inner" id="sbCenterInner"></div></div>
    </div>
    <div class="legend">
      <span><i style="background:#4E7D57"></i>충청권</span>
      <span><i style="background:#B0602F"></i>전라권</span>
      <span><i style="background:#385E92"></i>경상권</span>
      <span><i style="background:#95315A"></i>수도권</span>
      <span><i style="background:#1E7C70"></i>제주</span>
      <span><i style="background:#6C5D8A"></i>이벤트</span>
    </div>

    <div id="rankWrap" class="rankwrap" style="display:none">
      <table>
        <thead><tr><th>순위</th><th>이름</th><th class="num">순자산</th></tr></thead>
        <tbody id="rankBody"></tbody>
      </table>
    </div>
    <div class="phase" id="phaseLine"></div>
  </div>

<script>
  const params = new URLSearchParams(location.search);
  const roomCode = (params.get("room") || "").toUpperCase();
  if (params.get("transparent") === "1") document.body.classList.add("transparent");
  document.getElementById("codeLine").textContent = roomCode ? "방 코드 " + roomCode : "URL에 ?room=방코드 를 붙여주세요";

  const REGION_COLOR = { cc:"#4E7D57", jl:"#B0602F", gs:"#385E92", sd:"#95315A", jj:"#1E7C70" };
  const TOKEN_COLORS = ["#D9A441", "#4E9F63", "#5B8DEF", "#C9598F"];
  let lastCenterWhoKey = null; // "누구 차례" 아바타를 실제로 바뀔 때만 다시 그리기 위한 캐시
  let lastRankingKey = null; // 최종 순위 표를 내용이 같으면 다시 그리지 않기 위한 캐시

  // player.html과 동일한 캐릭터 목록/아바타 표시 로직. 나중에 public/characters/char1~4.png를
  // 저장소에 올리면 시청자 화면에서도 자동으로 그 이미지가 적용됨(지금은 이모지로 대체 표시).
  const CHARACTERS = [
    { id: 1, name: "호랑이", emoji: "🐯", color: "#D9A441" },
    { id: 2, name: "토끼", emoji: "🐰", color: "#4E9F63" },
    { id: 3, name: "두루미", emoji: "🕊️", color: "#5B8DEF" },
    { id: 4, name: "여우", emoji: "🦊", color: "#C9598F" },
  ];
  function characterById(id) {
    return CHARACTERS.find((c) => c.id === Number(id)) || null;
  }
  function avatarHtml(charId, sizePx) {
    const c = characterById(charId);
    if (!c) return '<div class="avatar" style="width:' + sizePx + 'px;height:' + sizePx + 'px"></div>';
    const fs = Math.round(sizePx * 0.55);
    return (
      '<div class="avatar" style="width:' + sizePx + 'px;height:' + sizePx + 'px;border-color:' + c.color + '">' +
      '<img src="/characters/char' + c.id + '.png" alt="' + c.name + '" ' +
      'onerror="this.style.display=\'none\'; if (this.nextElementSibling) this.nextElementSibling.style.display=\'flex\'" />' +
      '<span class="avatar-fallback" style="font-size:' + fs + 'px">' + c.emoji + "</span>" +
      "</div>"
    );
  }
  // 21칸을 정사각형 둘레에 배치한 좌표(%, 왼쪽 위 기준). 모서리는 pos 0/6/11/16. (player.html과 동일)
  const TILE_COORDS = [
    [0, 100], [16.67, 100], [33.33, 100], [50, 100], [66.67, 100], [83.33, 100], [100, 100],
    [100, 80], [100, 60], [100, 40], [100, 20], [100, 0],
    [80, 0], [60, 0], [40, 0], [20, 0], [0, 0],
    [0, 20], [0, 40], [0, 60], [0, 80],
  ];
  const TILES = [
    { pos:0, name:"귀성길 출발", type:"start" },
    { pos:1, name:"대전", type:"city", region:"cc" },
    { pos:2, name:"세종", type:"city", region:"cc" },
    { pos:3, name:"전통시장", type:"event" },
    { pos:4, name:"청주", type:"city", region:"cc" },
    { pos:5, name:"친척집", type:"event" },
    { pos:6, name:"광주", type:"city", region:"jl" },
    { pos:7, name:"전주", type:"city", region:"jl" },
    { pos:8, name:"고속도로 정체", type:"event" },
    { pos:9, name:"목포", type:"city", region:"jl" },
    { pos:10, name:"송편가게", type:"event" },
    { pos:11, name:"부산", type:"city", region:"gs" },
    { pos:12, name:"대구", type:"city", region:"gs" },
    { pos:13, name:"달토끼 상점", type:"event" },
    { pos:14, name:"울산", type:"city", region:"gs" },
    { pos:15, name:"복불복 윷판", type:"event" },
    { pos:16, name:"제주", type:"city", region:"jj" },
    { pos:17, name:"인천", type:"city", region:"sd" },
    { pos:18, name:"친척집", type:"event" },
    { pos:19, name:"수원", type:"city", region:"sd" },
    { pos:20, name:"서울", type:"city", region:"sd" },
  ];
  const fmt = (n) => (n || 0).toLocaleString("ko-KR");
  const tokenColor = (p) => {
    const c = characterById(p && p.characterId);
    if (c) return c.color;
    return TOKEN_COLORS[(p ? p.seat : 0) % TOKEN_COLORS.length];
  };
  // 칸이 정사각형 테두리(0~100%)에 딱 붙으면 절반이 컨테이너 밖으로 잘리므로, 칸 크기(13%)의
  // 절반만큼 안쪽으로 들여서 배치.
  const SB_MARGIN = 7;
  function insetPct(v) {
    return SB_MARGIN + (v * (100 - 2 * SB_MARGIN)) / 100;
  }

  function ensureTiles(container) {
    TILES.forEach((tile) => {
      if (document.getElementById("sbTile" + tile.pos)) return;
      const box = document.createElement("div");
      box.id = "sbTile" + tile.pos;
      box.className = "sb-tile";
      const [x, y] = TILE_COORDS[tile.pos];
      box.style.left = insetPct(x) + "%";
      box.style.top = insetPct(y) + "%";
      const color = tile.type === "city" ? REGION_COLOR[tile.region] : null;
      // 이미지/색상 배경/이름은 칸이 처음 생길 때 한 번만 만듭니다 — 매초 폴링마다 다시 만들면
      // <img>가 초마다 새로 생성되어 없는 이미지를 계속 재요청하게 되고, 그게 쌓이면 다른 요청이
      // 지연될 수 있습니다. owner/tokens만 poll()에서 별도로 갱신합니다.
      box.innerHTML =
        '<img class="sb-tile-img" src="/tiles/tile' + tile.pos + '.png" alt="" ' +
        "onerror=\"this.style.display='none'; if (this.nextElementSibling) this.nextElementSibling.style.display='none'\" />" +
        '<span class="sb-tile-shade"></span>' +
        (color ? '<span class="sb-region" style="background:' + color + '"></span>' : "") +
        '<span class="sb-name">' + tile.name + "</span>" +
        '<div class="sb-owner" id="sbOwner' + tile.pos + '"></div>' +
        '<div class="sb-tokens" id="sbTokens' + tile.pos + '"></div>';
      container.appendChild(box);
    });
  }

  // 참가자 카드(아바타 포함)는 처음 한 번만 만들고, 이후 폴링에서는 연결 상태/파산 여부/
  // 자금처럼 실제로 바뀌는 부분만 갱신합니다. 매초 통째로 다시 그리면 아바타 <img>가 매번
  // 새로 생성되어, 방송 화면(시청자가 보는 화면)이 계속 깜빡이는 것처럼 보입니다.
  const gridCardEls = {};
  function renderGrid(players, statePlayers) {
    const grid = document.getElementById("grid");
    players.forEach((p) => {
      const stateP = statePlayers ? statePlayers[p.id] : null;
      let entry = gridCardEls[p.id];
      if (!entry) {
        const card = document.createElement("div");
        card.className = "card";
        card.style.borderTopColor = tokenColor(p);
        card.innerHTML =
          avatarHtml(p.characterId, 44) +
          '<div><div class="name"><span class="dot" id="gDot_' + p.id + '"></span>' + p.name + "</div>" +
          '<div class="seat" id="gSeat_' + p.id + '"></div>' +
          '<div class="cash" id="gCash_' + p.id + '"></div></div>';
        grid.appendChild(card);
        entry = gridCardEls[p.id] = {
          dotEl: document.getElementById("gDot_" + p.id),
          seatEl: document.getElementById("gSeat_" + p.id),
          cashEl: document.getElementById("gCash_" + p.id),
        };
      }
      entry.dotEl.classList.toggle("on", !!(p.connected || p.isBot));
      entry.seatEl.textContent = (p.isBot ? "BOT · " : "") + "#" + (p.seat + 1) + "번" + (stateP && stateP.bankrupt ? " · 파산" : "");
      entry.cashEl.style.display = stateP ? "" : "none";
      if (stateP) entry.cashEl.textContent = fmt(stateP.cash) + " 원";
    });
  }

  async function poll() {
    if (!roomCode) return;
    try {
      const res = await fetch("/api/rooms/" + roomCode + "/state");
      const data = await res.json();
      if (!data.ok) return;

      renderGrid(data.players, data.state && data.state.players ? data.state.players : null);

      document.getElementById("phaseLine").textContent =
        data.status === "waiting" ? "참가자를 기다리는 중" : data.status === "ended" ? "게임 종료" : "게임 진행 중";

      const state = data.state;
      const boardWrap = document.getElementById("boardWrap");
      const rankWrap = document.getElementById("rankWrap");
      const centerInner = document.getElementById("sbCenterInner");

      if (!state || !state.players) {
        centerInner.innerHTML = "";
        lastCenterWhoKey = null;
        return;
      }
      // 가운데(누구 차례인지) 칸의 껍데기(who/what/timer 세 줄)는 한 번만 만들고, 이후에는
      // 그 안의 각 부분만 갱신합니다 — 특히 아바타가 들어있는 who 줄은 실제로 차례가 바뀔
      // 때만 다시 그려서, 매초 아바타 이미지가 깜빡이는 걸 막습니다.
      if (!document.getElementById("cWho")) {
        centerInner.innerHTML = '<div class="who" id="cWho"></div><div class="what" id="cWhat"></div><div id="cTimer"></div>';
        lastCenterWhoKey = null;
      }
      const cWho = document.getElementById("cWho");
      const cWhat = document.getElementById("cWhat");
      const cTimer = document.getElementById("cTimer");

      let timerHtml = "";
      if (state.gameStartedAt) {
        const elapsed = data.serverTime - state.gameStartedAt;
        const mins = Math.floor(elapsed / 60000);
        const secs = Math.floor((elapsed % 60000) / 1000);
        const hot = elapsed > 90 * 60 * 1000;
        timerHtml = '<div class="timer' + (hot ? " hot" : "") + '">경과 ' +
          String(mins).padStart(2, "0") + ":" + String(secs).padStart(2, "0") +
          (hot ? " · 통행료 2배" : "") + "</div>";
      }

      if (state.phase === "ended") {
        if (lastCenterWhoKey !== "ended") {
          cWho.textContent = "게임 종료";
          lastCenterWhoKey = "ended";
        }
        cWhat.textContent = "";
        cTimer.textContent = "";
        boardWrap.style.opacity = "0.4";
        rankWrap.style.display = "block";
        // 최종 순위는 종료 시점에 확정되면 더 바뀌지 않으므로, 내용이 같으면 다시 그리지
        // 않습니다(계속 종료 화면을 띄워둔 채로 매초 아바타가 깜빡이는 걸 방지).
        const rankKey = (state.finalRanking || []).map((r) => r.playerId + ":" + r.rank + ":" + r.netWorth).join(",");
        if (rankKey !== lastRankingKey) {
          lastRankingKey = rankKey;
          const body = document.getElementById("rankBody");
          body.innerHTML = "";
          (state.finalRanking || []).forEach((r) => {
            const tr = document.createElement("tr");
            const charId = state.players[r.playerId] ? state.players[r.playerId].characterId : null;
            tr.innerHTML =
              "<td>" + r.rank + "위</td>" +
              "<td><span class='name-avatar'>" + avatarHtml(charId, 26) + "<span>" + r.name + "</span></span></td>" +
              "<td class='num'>" + fmt(r.netWorth) + "</td>";
            body.appendChild(tr);
          });
        }
      } else {
        boardWrap.style.opacity = "1";
        rankWrap.style.display = "none";
        const cur = state.players[state.currentPlayerId];
        const whoKey = cur ? cur.characterId + "|" + cur.name : "none";
        if (whoKey !== lastCenterWhoKey) {
          cWho.innerHTML = cur
            ? '<span class="name-avatar">' + avatarHtml(cur.characterId, 28) + "<span>" + cur.name + "의 차례</span></span>"
            : "";
          lastCenterWhoKey = whoKey;
        }
        cWhat.textContent = turnPhaseLabel(state.turnPhase);
        cTimer.innerHTML = timerHtml;

        ensureTiles(boardWrap);
        const posToPlayers = {};
        Object.values(state.players).forEach((p) => {
          if (p.bankrupt) return;
          (posToPlayers[p.position] = posToPlayers[p.position] || []).push(p);
        });
        TILES.forEach((tile) => {
          const box = document.getElementById("sbTile" + tile.pos);
          const here = !!posToPlayers[tile.pos];
          box.className = "sb-tile" + (tile.type === "start" ? " start" : tile.type === "event" ? " event" : "") + (here ? " here" : "");
          let ownerHtml = "";
          if (tile.type === "city") {
            const prop = state.properties[tile.pos];
            if (prop) {
              const ownerP = state.players[prop.ownerId];
              const buildMark = prop.building === "hotel" ? "★" : prop.building === "villa" ? "▲" : "";
              ownerHtml = (ownerP ? ownerP.name.slice(0, 3) : "?") + buildMark;
            }
          }
          const ownerEl = document.getElementById("sbOwner" + tile.pos);
          if (ownerEl) ownerEl.textContent = ownerHtml;

          const tokensHtml = here
            ? posToPlayers[tile.pos]
                .map((p) => {
                  const c = characterById(p.characterId);
                  return '<span class="sb-token" style="background:' + tokenColor(p) + '">' + (c ? c.emoji : "") + "</span>";
                })
                .join("")
            : "";
          const tokensEl = document.getElementById("sbTokens" + tile.pos);
          if (tokensEl) tokensEl.innerHTML = tokensHtml;
        });
      }
    } catch (e) {
      /* 방송 화면은 조용히 재시도만 함 */
    }
  }

  function turnPhaseLabel(tp) {
    return {
      "awaiting-roll": "주사위 굴리는 중",
      "awaiting-buy": "도시 구매 결정 중",
      "awaiting-event": "이벤트 처리 중",
      "awaiting-toll": "통행료 면제권 사용 결정 중",
      "awaiting-endturn": "턴 마무리 중",
    }[tp] || "";
  }

  poll();
  setInterval(poll, 1000);
</script>
</body>
</html>
