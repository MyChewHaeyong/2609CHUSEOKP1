<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>팔도마블 - 중계 화면</title>
<style>
  :root{ --bg:#1E1B3A; --panel:#262048cc; --gold:#D9A441; --cream:#F4E9D8; --line:#3A3466; --ok:#4E9F63; }
  *{box-sizing:border-box}
  html,body{margin:0; width:100%; height:100%}
  body{background:var(--bg); color:var(--cream); font-family:"Malgun Gothic","맑은 고딕",sans-serif; display:flex; align-items:center; justify-content:center;}
  body.transparent{background:transparent}
  .board{width:min(90vw,900px)}
  h1{color:var(--gold); font-size:32px; margin:0 0 4px; text-align:center}
  .code{text-align:center; font-size:15px; color:#cfcbea; margin-bottom:22px; letter-spacing:.05em}
  .grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px 18px; backdrop-filter:blur(2px)}
  .card .name{font-size:19px; font-weight:700}
  .card .seat{font-size:12.5px; color:#9d97c2; margin-top:2px}
  .dot{width:9px; height:9px; border-radius:50%; display:inline-block; margin-right:8px; background:#666}
  .dot.on{background:var(--ok)}
  .phase{text-align:center; margin-top:22px; font-size:14px; color:#cfcbea}
</style>
</head>
<body>
  <div class="board">
    <h1>팔도마블</h1>
    <div class="code" id="codeLine">방 코드 -</div>
    <div class="grid" id="grid"></div>
    <div class="phase" id="phaseLine"></div>
  </div>

<script>
  const params = new URLSearchParams(location.search);
  const roomCode = (params.get("room") || "").toUpperCase();
  if (params.get("transparent") === "1") document.body.classList.add("transparent");
  document.getElementById("codeLine").textContent = roomCode ? "방 코드 " + roomCode : "URL에 ?room=방코드 를 붙여주세요";

  async function poll() {
    if (!roomCode) return;
    try {
      const res = await fetch("/api/rooms/" + roomCode + "/state");
      const data = await res.json();
      if (!data.ok) return;
      const grid = document.getElementById("grid");
      grid.innerHTML = "";
      data.players.forEach((p) => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML =
          '<div class="name"><span class="dot ' + (p.connected ? "on" : "") + '"></span>' + p.name + "</div>" +
          '<div class="seat">' + (p.isBot ? "BOT · " : "") + "#" + (p.seat + 1) + "번</div>";
        grid.appendChild(card);
      });
      document.getElementById("phaseLine").textContent =
        data.status === "waiting" ? "참가자를 기다리는 중" : data.status;
    } catch (e) {
      /* 방송 화면은 조용히 재시도만 함 */
    }
  }
  poll();
  setInterval(poll, 1000);
</script>
</body>
</html>
