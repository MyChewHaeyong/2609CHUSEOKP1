<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>만찬경매 - 중계 화면</title>
<style>
  :root{ --bg:#1E1B3A; --panel:#262048cc; --gold:#D9A441; --cream:#F4E9D8; --line:#3A3466; --ok:#4E9F63; --red:#E5867A; }
  *{box-sizing:border-box}
  html,body{margin:0; width:100%; height:100%}
  body{background:var(--bg); color:var(--cream); font-family:"Malgun Gothic","맑은 고딕",sans-serif;}
  body.transparent{background:transparent}
  .wrap{max-width:1200px; margin:0 auto; padding:22px}
  h1{color:var(--gold); font-size:28px; margin:0 0 2px; text-align:center}
  .code{text-align:center; font-size:14px; color:#cfcbea; margin-bottom:6px; letter-spacing:.05em}
  .phase{text-align:center; margin-bottom:18px; font-size:14px; color:#cfcbea}

  .avatar{position:relative; border-radius:50%; border:2px solid var(--line); display:flex; align-items:center; justify-content:center; overflow:hidden; flex-shrink:0; background:#160f2e}
  .avatar img{display:block; width:100%; height:100%; object-fit:cover}
  .avatar .avatar-fallback{display:none; line-height:1}
  .name-avatar{display:inline-flex; align-items:center; gap:8px}

  .roundcard{max-width:520px; margin:0 auto 26px; background:var(--panel); border:1px solid var(--gold); border-radius:16px; padding:22px; text-align:center; backdrop-filter:blur(2px)}
  .mystery{font-size:64px; line-height:1}
  .roundcard .rtitle{font-size:17px; color:var(--gold); font-weight:700; margin-top:8px}
  .roundcard .timer{font-family:monospace; font-size:38px; margin:10px 0; color:var(--cream)}
  .roundcard .timer.hot{color:var(--red)}
  .roundcard .bidline{font-size:15px; color:#cfcbea}
  .roundcard .bidline b{color:var(--gold)}

  .votecard{max-width:520px; margin:0 auto 26px; background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:22px; text-align:center; backdrop-filter:blur(2px)}
  .votecard .timer{font-family:monospace; font-size:34px; margin:8px 0; color:var(--gold)}

  .tablegrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:16px}
  .tablecard{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px; backdrop-filter:blur(2px); border-top:3px solid transparent}
  .tablecard .head{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px}
  .tablecard .head .name{font-size:16px; font-weight:700}
  .tablecard .head .cash{font-size:12.5px; color:var(--gold)}
  .dot{width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:7px; background:#666}
  .dot.on{background:var(--ok)}

  .sang{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; min-height:64px}
  .sangcell{aspect-ratio:1/1; border-radius:8px; background:#100e24; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; overflow:hidden; position:relative}
  .sangcell img{width:100%; height:100%; object-fit:cover; display:block}
  .sangcell img.err{display:none}
  .sangcell .lbl{position:absolute; bottom:0; left:0; right:0; font-size:9.5px; text-align:center; background:rgba(0,0,0,.55); padding:2px 1px; line-height:1.2}
  .sang.empty-hint{align-items:center; justify-content:center; grid-column:1/-1; color:#6a6390; font-size:12px}

  .rankgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:20px; margin-top:6px}
  .rankcard{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:16px; text-align:center; backdrop-filter:blur(2px)}
  .rankcard.r1{border-color:var(--gold); box-shadow:0 0 0 1px var(--gold)}
  .rankcard .rankbadge{font-size:13px; color:var(--gold); font-weight:700; margin-bottom:6px}
  .rankcard .rname{font-size:18px; font-weight:700; margin-bottom:4px}
  .rankcard .rvotes{font-size:12.5px; color:#cfcbea; margin-bottom:10px}
  .rankcard .sang{grid-template-columns:repeat(4,1fr)}
  .rankcard .sangcell{aspect-ratio:1/1}

  .waitline{text-align:center; margin-top:60px; font-size:16px; color:#9d97c2}
</style>
</head>
<body>
  <div class="wrap">
    <h1>만찬경매</h1>
    <div class="code" id="codeLine">방 코드 -</div>
    <div class="phase" id="phaseLine"></div>

    <div id="roundCard" class="roundcard hidden" style="display:none">
      <div class="mystery">❓</div>
      <div class="rtitle" id="roundTitle">미공개 품목 - / 14</div>
      <div class="timer" id="roundTimer">--:--</div>
      <div class="bidline" id="bidLine"></div>
    </div>

    <div id="resultCard" class="roundcard" style="display:none">
      <div id="resultThumb" class="sangcell" style="width:100px; height:100px; margin:0 auto 10px"></div>
      <div class="rtitle" id="resultTitle">공개!</div>
      <div style="font-size:22px; font-weight:700; margin:10px 0 4px" id="resultWinnerLine"></div>
      <div class="bidline" id="resultPriceLine"></div>
      <div style="font-size:12.5px; color:#9d97c2; margin-top:12px">진행자가 다음 품목을 곧 엽니다</div>
    </div>

    <div id="voteCard" class="votecard" style="display:none">
      <h2 style="color:var(--gold); margin:0 0 6px; font-size:16px">시청자 투표 진행 중</h2>
      <div class="timer" id="voteTimer">--:--</div>
      <div style="font-size:13px; color:#cfcbea">완성된 차례상을 보고 투표해주세요</div>
    </div>

    <div id="waitLine" class="waitline" style="display:none">참가자를 기다리는 중입니다</div>

    <div id="tableSection">
      <div class="tablegrid" id="tableGrid"></div>
    </div>

    <div id="rankSection" style="display:none; margin-top:10px">
      <h2 style="text-align:center; color:var(--gold); font-size:20px">최종 결과</h2>
      <div class="rankgrid" id="rankGrid"></div>
      <div style="text-align:center; margin-top:16px; font-size:12.5px; color:#9d97c2">경품은 사람 참가자에게만 지급됩니다</div>
    </div>
  </div>

<script>
  const params = new URLSearchParams(location.search);
  const roomCode = (params.get("room") || "").toUpperCase();
  if (params.get("transparent") === "1") document.body.classList.add("transparent");
  document.getElementById("codeLine").textContent = roomCode ? "방 코드 " + roomCode : "URL에 ?room=방코드 를 붙여주세요";

  const TOKEN_COLORS = ["#D9A441", "#4E9F63", "#5B8DEF", "#C9598F"];
  const CHARACTERS = [
    { id: 1, name: "호랑이", emoji: "🐯", color: "#D9A441" },
    { id: 2, name: "토끼", emoji: "🐰", color: "#4E9F63" },
    { id: 3, name: "두루미", emoji: "🕊️", color: "#5B8DEF" },
    { id: 4, name: "여우", emoji: "🦊", color: "#C9598F" },
  ];
  function characterById(id) {
    return CHARACTERS.find((c) => c.id === Number(id)) || null;
  }
  function avatarHtml(charId, sizePx) {
    const c = characterById(charId);
    if (!c) return '<div class="avatar" style="width:' + sizePx + 'px;height:' + sizePx + 'px"></div>';
    const fs = Math.round(sizePx * 0.55);
    return (
      '<div class="avatar" style="width:' + sizePx + 'px;height:' + sizePx + 'px;border-color:' + c.color + '">' +
      '<img src="/characters/char' + c.id + '.png" alt="' + c.name + '" ' +
      'onerror="this.style.display=\'none\'; if (this.nextElementSibling) this.nextElementSibling.style.display=\'flex\'" />' +
      '<span class="avatar-fallback" style="font-size:' + fs + 'px">' + c.emoji + "</span>" +
      "</div>"
    );
  }
  const tokenColor = (p) => {
    const c = characterById(p && p.characterId);
    if (c) return c.color;
    return TOKEN_COLORS[(p ? p.seat : 0) % TOKEN_COLORS.length];
  };
  const fmt = (n) => (n || 0).toLocaleString("ko-KR");

  // 낙찰받은 품목 이미지 — public/banquet/<slug>.png 를 올리면 자동으로 확대된 이미지로
  // 표시되고, 아직 없으면(지금 상태) 이름표만 있는 기본 칸으로 대체됩니다.
  function sangCell(it) {
    return (
      '<div class="sangcell"><img src="/banquet/' + it.slug + '.png" alt="" ' +
      'onerror="this.classList.add(\'err\')" /><div class="lbl">' + it.name + "</div></div>"
    );
  }

  function renderCountdown(elId, deadlineAt, serverTime) {
    const el = document.getElementById(elId);
    if (!deadlineAt) { el.textContent = "--:--"; return; }
    const remainMs = Math.max(0, deadlineAt - serverTime);
    const s = Math.ceil(remainMs / 1000);
    const mm = String(Math.floor(s / 60)).padStart(2, "0");
    const ss = String(s % 60).padStart(2, "0");
    el.textContent = mm + ":" + ss;
    el.classList.toggle("hot", s <= 15);
  }

  // 플레이어별 카드 DOM을 재사용합니다(폴링마다 통째로 새로 만들지 않음). 아바타/이미지가
  // 없는 품목은 <img>가 매초 새로 생성되면 브라우저가 같은 404 이미지를 초마다 다시 요청하게
  // 되어, 그게 쌓이면 실제 입찰/상태 갱신 요청이 뒤에서 밀려 화면이 느려 보일 수 있습니다.
  // 그래서 카드 껍데기(아바타 포함)는 처음 한 번만 만들고, 이후에는 자금/낙찰 개수/품목
  // 이미지 칸처럼 실제로 바뀌는 부분만 갱신합니다.
  const tableCardEls = {};
  let lastResultThumbSlug = null;
  function renderTables(players, statePlayers, maxItems) {
    const grid = document.getElementById("tableGrid");
    players.forEach((p) => {
      const sp = statePlayers[p.id] || {};
      const items = sp.wonItems || [];
      let entry = tableCardEls[p.id];
      if (!entry) {
        const card = document.createElement("div");
        card.className = "tablecard";
        card.style.borderTopColor = tokenColor(p);
        card.innerHTML =
          '<div class="head"><div class="name-avatar">' + avatarHtml(p.characterId, 30) +
          '<span class="name"><span class="dot" id="tDot_' + p.id + '"></span>' + p.name + (p.isBot ? " · BOT" : "") + "</span></div>" +
          '<div style="text-align:right"><div class="cash" id="tCash_' + p.id + '"></div>' +
          '<div style="font-size:11.5px; color:#9d97c2" id="tCount_' + p.id + '"></div></div></div>' +
          '<div class="sang" id="tSang_' + p.id + '"></div>';
        grid.appendChild(card);
        entry = tableCardEls[p.id] = {
          dotEl: document.getElementById("tDot_" + p.id),
          cashEl: document.getElementById("tCash_" + p.id),
          countEl: document.getElementById("tCount_" + p.id),
          sangEl: document.getElementById("tSang_" + p.id),
          lastItemCount: -1,
        };
      }
      entry.dotEl.classList.toggle("on", !!(p.connected || p.isBot));
      entry.cashEl.textContent = fmt(sp.cash) + " 원";
      entry.countEl.textContent = "낙찰 " + items.length + " / " + maxItems;
      if (items.length !== entry.lastItemCount) {
        entry.sangEl.innerHTML = items.length ? items.map(sangCell).join("") : '<div class="empty-hint">아직 낙찰받은 품목 없음</div>';
        entry.lastItemCount = items.length;
      }
    });
  }

  // 최종 결과는 "종료" 이후 바뀌지 않으므로, 화면에 이미 그려둔 것과 같으면 다시 그리지
  // 않습니다(그렇지 않으면 결과 화면을 띄워둔 채로 초마다 이미지가 다시 요청됩니다).
  let lastResultsSignature = null;
  function renderResults(results, players, statePlayers, maxItems) {
    const signature = JSON.stringify(results.displayRanking.map((r) => [r.playerId, r.rank, r.votes]));
    if (signature === lastResultsSignature) return;
    lastResultsSignature = signature;
    const nameOf = (id) => { const p = players.find((x) => x.id === id); return p ? p : { name: id }; };
    const grid = document.getElementById("rankGrid");
    grid.innerHTML = "";
    results.displayRanking.forEach((r) => {
      const p = nameOf(r.playerId);
      const sp = statePlayers[r.playerId] || {};
      const items = sp.wonItems || [];
      const card = document.createElement("div");
      card.className = "rankcard" + (r.rank === 1 ? " r1" : "");
      card.innerHTML =
        '<div class="rankbadge">' + r.rank + "위" + (r.rank === 1 ? " 🏆" : "") + "</div>" +
        '<div class="name-avatar" style="justify-content:center; margin-bottom:6px">' + avatarHtml(p.characterId, 34) +
        '<span class="rname">' + p.name + "</span></div>" +
        '<div class="rvotes">득표 ' + r.votes + "표 · 낙찰 " + items.length + " / " + maxItems + "</div>" +
        '<div class="sang">' +
        (items.length ? items.map(sangCell).join("") : '<div class="empty-hint">낙찰받은 품목 없음</div>') +
        "</div>";
      grid.appendChild(card);
    });
  }

  async function poll() {
    if (!roomCode) return;
    try {
      const res = await fetch("/api/rooms/" + roomCode + "/state");
      const data = await res.json();
      if (!data.ok) return;

      const players = data.players || [];
      const st = data.state || {};

      const phaseLabel = {
        bidding: "경매 진행 중", "round-result": "품목 결과 공개", "table-review": "경매 종료 · 곧 투표 시작", voting: "시청자 투표 진행 중", ended: "최종 결과",
      };
      document.getElementById("phaseLine").textContent =
        data.status === "waiting" ? "참가자를 기다리는 중" : (phaseLabel[st.phase] || "");

      document.getElementById("waitLine").style.display = data.status === "waiting" ? "block" : "none";
      document.getElementById("tableSection").style.display = data.status === "waiting" || st.phase === "ended" ? "none" : "block";
      document.getElementById("roundCard").style.display = st.phase === "bidding" ? "block" : "none";
      document.getElementById("resultCard").style.display = st.phase === "round-result" ? "block" : "none";
      document.getElementById("voteCard").style.display = st.phase === "voting" ? "block" : "none";
      document.getElementById("rankSection").style.display = st.phase === "ended" ? "block" : "none";

      if (st.phase === "bidding" && st.currentRound) {
        const round = st.currentRound;
        document.getElementById("roundTitle").textContent = "미공개 품목 " + round.roundNumber + " / " + round.totalRounds;
        renderCountdown("roundTimer", round.deadlineAt, data.serverTime);
        document.getElementById("bidLine").innerHTML = round.currentBid
          ? "현재 최고가 <b>" + fmt(round.currentBid.amount) + "</b>"
          : "아직 입찰이 없습니다 · 시작가 " + fmt(round.startPrice);
      }
      if (st.phase === "round-result" && st.lastResult) {
        const r = st.lastResult;
        const statePlayers = st.players || {};
        // 같은 품목이 공개되어 있는 동안 폴링마다 <img>를 다시 만들면(=없는 이미지를 매초
        // 재요청) 다른 요청이 밀릴 수 있으므로, 품목이 바뀌었을 때만 새로 그립니다.
        if (lastResultThumbSlug !== r.slug) {
          document.getElementById("resultThumb").innerHTML =
            '<img src="/banquet/' + r.slug + '.png" alt="" onerror="this.classList.add(\'err\')" />';
          lastResultThumbSlug = r.slug;
        }
        document.getElementById("resultTitle").textContent = "공개! " + r.name;
        if (r.winnerId) {
          const w = statePlayers[r.winnerId];
          document.getElementById("resultWinnerLine").textContent = (w ? w.name : "?") + " 낙찰";
          document.getElementById("resultPriceLine").innerHTML = "<b>" + fmt(r.finalPrice) + "</b>원";
        } else {
          document.getElementById("resultWinnerLine").textContent = "유찰 (입찰 없음)";
          document.getElementById("resultPriceLine").textContent = "";
        }
      }
      if (st.phase === "voting") {
        renderCountdown("voteTimer", st.voteDeadlineAt, data.serverTime);
      }

      const maxItems = st.maxItemsPerPlayer || 5;
      if (data.status !== "waiting" && st.phase !== "ended") {
        renderTables(players, st.players || {}, maxItems);
      }
      if (st.phase === "ended" && st.results) {
        renderResults(st.results, players, st.players || {}, maxItems);
      }
    } catch (e) {
      /* 방송 화면은 조용히 재시도만 함 */
    }
  }

  poll();
  setInterval(poll, 1000);
</script>
</body>
</html>
